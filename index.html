    <script>
      // Gracefully handle dev environment Vite/HMR WebSocket disconnections
      (function() {
        function isWsHmrError(err) {
          if (!err) return false;
          var msg = (typeof err === 'string' ? err : (err.message || (err.reason && err.reason.message) || err.stack || '')) + '';
          return msg.indexOf('WebSocket closed without opened') !== -1;
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isWsHmrError(event.reason || event)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        });
        window.addEventListener('error', function(event) {
          if (isWsHmrError(event.error || event.message)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        });

        // Auto-recover if browser history serves stale deployment bundle (chunk 404)
        window.addEventListener('error', function(event) {
          var target = event.target;
          if (target && (target.tagName === 'LINK' || target.tagName === 'SCRIPT')) {
            var src = target.src || target.href || '';
            if (src && src.indexOf('/assets/') !== -1) {
              var reloadKey = 'aksara_chunk_retry_' + encodeURIComponent(src);
              if (!sessionStorage.getItem(reloadKey)) {
                sessionStorage.setItem(reloadKey, Date.now() + '');
                window.location.reload();
              }
            }
          }
        }, true);
      })();
